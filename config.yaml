    nome: "Imbrago da alpinismo"
    taglie: [M, "S/M", "M/L", "S-M", "M-L", "1"]   # "1" = taglia Petzl Corax (XS-M)
    prezzo_max: 70
    prezzo_top: 55
    prezzo_min: 35                   # sotto: portamateriale, sacchetti, accessori
    # scarta: imbraghi da lavoro, pettorali, kit ferrata, bambini
    escludi: [chest, pettorale, body, completo, kit, set, ferrata, work, lavoro, avao, astro, newton,
              falcon, sequoia, navaho, volt, toddler, chalk, magnesite, sacchetto, bag, portamateriale,
              gear, loop, sling, janja]

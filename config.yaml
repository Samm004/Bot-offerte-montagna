# ============================================================================
#  CONFIGURAZIONE DEL BOT OFFERTE
#  Si puo' modificare direttamente da GitHub (icona della matita ✏️).
#  Dopo ogni modifica il bot ricerca da capo i prodotti al giro successivo.
# ============================================================================

impostazioni:
  ogni_quante_ore_cerco_nuovi_prodotti: 6   # ricerca nuovi colori/modelli sui negozi
  pausa_tra_richieste_secondi: 2            # per non "martellare" i siti
  ora_riepilogo_giornaliero: 9              # ora italiana del messaggio del mattino
  avvisa_se_negozio_non_funziona_dopo: 3    # controlli falliti di fila prima dell'avviso
  tempo_massimo_minuti: 30                  # oltre, il bot salva e finisce il lavoro al giro dopo

# Negozi in cui il bot CERCA da solo i prodotti ({q} = testo cercato).
# Tutti verificati: il bot legge prezzo e disponibilita' per ogni taglia.
# Avvisa SOLO se la vostra taglia risulta disponibile.
negozi:
  - nome: Bergfreunde
    ricerca: "https://www.bergfreunde.it/index.php?cl=search&searchparam={q}"
  - nome: Bergzeit
    ricerca: "https://www.bergzeit.it/search/?query={q}"
  - nome: Oliunid
    ricerca: "https://www.oliunid.it/catalogsearch/result/?q={q}"
  - nome: Bananafingers
    ricerca: "https://bananafingers.com/catalogsearch/result/?q={q}"
  - nome: DF Sport Specialist
    ricerca: "https://df-sportspecialist.it/search?q={q}"
  - nome: Nencini Sport
    ricerca: "https://www.nencinisport.it/it/search.html?searchkey={q}"
    pausa: 6                      # blocca se si fanno richieste troppo ravvicinate
  - nome: Sestogrado
    ricerca: "https://www.sestogrado.it/it/?s={q}&post_type=product&type_aws=true"
  - nome: Alpinstore
    ricerca: "https://www.alpinstore.com/index.php?controller=search&search_query={q}"
  - nome: Max Sport Store
    ricerca: "https://maxsportstore.com/search?q={q}"
  - nome: Sportfits
    ricerca: "https://sportfits.eu/search?sSearch={q}"
  - nome: Decathlon               # utile per rinvii/attrezzatura Klimb (ex Simond)
    ricerca: "https://www.decathlon.it/search?Ntt={q}"
  - nome: Tonton Outdoor          # ricerca non leggibile: solo i link_extra
    sito: "https://www.tonton-outdoor.com"
  # Sportler: NON incluso, il sito blocca i bot con un controllo anti-robot.

# Parole che, se compaiono nel nome del prodotto, lo scartano sempre
# (versioni da donna / bambino).
escludi_sempre: [women, womens, woman, donna, damen, w, wmn, lady, ladies, femme, mujer,
                 kids, kid, junior, jr, bambino, bambini, youth, boys, girls]

# ----------------------------------------------------------------------------
#  ARTICOLI DA CERCARE
#   taglie       -> le taglie che vi vanno bene (per le corde: la lunghezza)
#   prezzo_max   -> sotto questo prezzo (disponibile nella vostra taglia) arriva l'avviso 🔥
#   prezzo_top   -> sotto questo prezzo l'avviso e' 🔥🔥 (affare vero)
#   diametro     -> solo corde: diametro minimo e massimo in mm
#   modelli      -> cosa cercare:
#       cerca        testo da scrivere nella ricerca del negozio
#       parole       parole che DEVONO esserci nel nome del prodotto
#       escludi      parole che scartano il prodotto
#       filtro_link  (opzionale) parole che devono esserci nel link della pagina
#       parole_una_di / filtro_link_una_di   basta UNA di queste parole
#       max_link     quante pagine prendere dai risultati (default 12)
#   prezzo_min   -> ignora prodotti sotto questo prezzo (accessori, articoli di fascia bassa)
#   link_extra   -> pagine prodotto da controllare sempre (negozi senza ricerca)
#
#  Le "ricerche generiche" (es. "corda singola") pescano qualsiasi marca:
#  il bot poi tiene solo quello che corrisponde a diametro / taglia / prezzo.
# ----------------------------------------------------------------------------

# liste di parole riutilizzate sotto
parole_corda: &parole_corda [corda, corde, rope, ropes, seil, kletterseil, halbseil, einfachseil,
                             zwillingsseil, cuerda]
parole_giacca: &parole_giacca [giacca, jacket, jkt, anorak, jacke]
parole_guscio: &parole_guscio [hardshell, gtx, gore, goretex, shell, hs, 3l, futurelight, pertex,
                               dryq, aquadefence, h2no, ascentshell]
parole_piccozza: &parole_piccozza [piccozza, piccozze, axe, piolet, eispickel, pickel, piolets]
parole_ramponi: &parole_ramponi [ramponi, rampone, crampon, crampons, steigeisen]
parole_lana: &parole_lana [merino, wool, lana, merinowolle, wolle, laine,
                           icebreaker, smartwool, ortovox, devold, woolpower, brynje, aclima, royale]
parole_maglia: &parole_maglia [shirt, tshirt, t, tee, maglia, maglietta, top, crew, crewe, longsleeve, ls, sleeve,
                               ss, base, layer, baselayer, langarmshirt, funktionsshirt, shirts, maglie]
parole_manica_lunga: &parole_manica_lunga [ls, long, longsleeve, lunga, lunghe, langarm, langarmshirt, ml]
parole_manica_corta: &parole_manica_corta [ss, short, corta, corte, kurzarm, mc, tee, tshirt, t]
escludi_maglie: &escludi_maglie [socks, sock, calze, calza, boxer, boxers, brief, briefs, slip, mutande,
                                 bra, reggiseno, canotta, tank, singlet, leggings, tights, pant, pants,
                                 pantaloni, calzamaglia, shorts, beanie, berretto, cap, hat, buff, tubular,
                                 scaldacollo, neck, gaiter, guanti, gloves, giacca, jacket, vest, gilet,
                                 hoody, hoodie, felpa, dress, abito, polo]
parole_imbrago: &parole_imbrago [imbrago, imbraghi, imbracatura, harness, gurt, klettergurt, sitzgurt, baudrier]

articoli:

  # ------------------------------------------------------------- GUSCI
  - id: guscio
    nome: "Guscio hardshell"
    taglie: [M, L]
    prezzo_max: 300
    prezzo_top: 250
    prezzo_min: 180      # sotto i 180 € sono giacche antipioggia economiche, non gusci da alpinismo
    # scarta pantaloni, ghette, guanti, giacche imbottite, pile... (stessi nomi di linea)
    escludi: [pant, pants, pantaloni, pantalone, hose, bib, salopette, shorts, short, glove, gloves,
              guanti, guanto, mitt, mitts, gilet, vest, cap, hat, berretto, beanie, fleece, pile,
              down, piumino, primaloft, insulated, softshell, alpha, octa, warm1, warm2, warm3,
              wool, merino, shirt, tshirt, maglia, maglietta, hoody, hoodie, bag, zaino,
              gaiter, gaiters, ghetta, ghette, gamaschen, boot, boots, scarpone, scarponi, shoe, shoes,
              # giacche da pioggia/trekking, imbottite, 2 strati, marche non da montagna
              rain, thermo, invernale, winter, 2l, 5l, paclite, daiwa, fishing, pesca, golf, urban, city,
              ski, sci, snowboard, running, trail, run, bike, mtb, cycling]
    richiedi_una_di: [giacca, jacket, jkt, anorak, jacke, hooded]
    modelli:
      - cerca: "crater"                 # Mammut Crater IV / Light / Pro HS
        parole: [mammut, crater]
        escludi: [lake]
      - cerca: "alto guide"             # Mammut Alto Guide HS
        parole: [alto, guide]
      - cerca: "triolet"                # Patagonia Triolet
        parole: [triolet]
      - cerca: "kangri"                 # Rab Kangri GTX
        parole: [kangri]
      - cerca: "latok"                  # Rab Latok Mountain GTX
        parole: [latok]
      - cerca: "makalu"                 # Mountain Equipment Makalu
        parole: [equipment, makalu]
      - cerca: "lhotse"                 # Mountain Equipment Lhotse
        parole: [equipment, lhotse]
      - cerca: "ortles gtx"             # Salewa Ortles GTX 3L / Pro
        parole: [ortles, gtx]
        filtro_link: [ortles]
      - cerca: "beta jacket"            # Arc'teryx Beta / Beta LT / Beta AR
        parole: [teryx, beta]
        filtro_link: [beta]
      - cerca: "falketind gore-tex"     # Norrona Falketind Gore-Tex
        parole: [falketind, gore]
        filtro_link: [falketind]
      - cerca: "westalpen 3l"           # Ortovox Westalpen 3L
        parole: [westalpen, 3l]
        filtro_link: [westalpen]
      # ricerche generiche: qualsiasi guscio da uomo di qualsiasi marca
      - &guscio_generico
        cerca: "giacca hardshell"
        parole: []
        parole_una_di: [*parole_guscio, *parole_giacca]
        filtro_link: []
        filtro_link_una_di: [hardshell, gtx, gore, tex, shell, hs, 3l, giacca, jacket, jacke]
        max_link: 40
      - {<<: *guscio_generico, cerca: "giacca gore-tex uomo"}
      - {<<: *guscio_generico, cerca: "hardshell jacket"}
      - {<<: *guscio_generico, cerca: "giacca alpinismo"}

  # ------------------------------------------------------------- SCARPONI
  - id: trango-alpine
    nome: "La Sportiva Trango Alpine GTX"
    taglie: ["42.5"]
    prezzo_max: 300
    prezzo_top: 260
    modelli:
      - cerca: "trango alpine"
        parole: [trango, alpine]

  - id: aequilibrium-st
    nome: "La Sportiva Aequilibrium ST GTX"
    taglie: ["42.5"]
    prezzo_max: 300
    prezzo_top: 250
    modelli:
      - cerca: "aequilibrium st"
        parole: [aequilibrium, st]
    link_extra:
      - "https://www.tonton-outdoor.com/it_IT/p/la-sportiva-aequilibrium-st-gtx-uomo-3162"

  # ------------------------------------------------------------- CORDE
  # Il bot legge il diametro dal nome del prodotto (es. "Cobra II 8.6") e la
  # lunghezza dalla variante (es. "60 m"). Le soglie di prezzo sono una mia
  # stima: cambiatele come preferite.
  - id: corda-60m-8mm
    nome: "Corda ~8 mm da 60 m"
    taglie: ["60m"]
    diametro: [7.6, 8.7]
    prezzo_max: 130
    prezzo_top: 110
    escludi: &escludi_corde [statica, static, semistatica, semi, cordino, cordini, accessory,
                             kit, bag, sacca, sacco, telo, tarp, protector, protezione, marker]
    modelli:
      - {cerca: "beal cobra", parole: [cobra]}             # Beal Cobra II 8.6 (mezza)
      - {cerca: "beal ice line", parole: [ice, line]}      # Beal Ice Line 8.1
      - {cerca: "beal opera", parole: [opera]}             # Beal Opera 8.5 (singola)
      - {cerca: "starling", parole: [starling]}            # Edelrid Starling 8.2
      - {cerca: "paso guide", parole: [paso]}              # Petzl Paso Guide 7.7
      - {cerca: "petzl salsa", parole: [salsa]}            # Petzl Salsa 8.2
      - {cerca: "tendon alpine", parole: [tendon, alpine]} # Tendon Alpine 7.9
      - {cerca: "alpine sender", parole: [alpine, sender]} # Mammut Alpine Sender 8.7
      - {cerca: "alpine core", parole: [alpine, core]}     # Mammut Alpine Core 8.7
      - {cerca: "mammut phoenix", parole: [phoenix]}       # Mammut Phoenix 8.0
      # ricerche generiche: qualsiasi marca, filtrata per diametro e lunghezza
      - &corda_generica
        cerca: "mezza corda"
        parole: []
        filtro_link: []
        filtro_link_una_di: *parole_corda
        max_link: 40
      - {<<: *corda_generica, cerca: "corda gemellare"}
      - {<<: *corda_generica, cerca: "corda 8 mm"}
      - {<<: *corda_generica, cerca: "half rope"}
      - {<<: *corda_generica, cerca: "corda dinamica"}

  - id: corda-80m-9-5mm
    nome: "Corda ~9,5 mm da 80 m"
    taglie: ["80m"]
    diametro: [9.2, 9.8]
    prezzo_max: 170
    prezzo_top: 150
    escludi: *escludi_corde
    modelli:
      - {cerca: "beal booster", parole: [booster]}         # Beal Booster III 9.7
      - {cerca: "beal stinger", parole: [stinger]}         # Beal Stinger 9.4
      - {cerca: "beal karma", parole: [karma]}             # Beal Karma 9.8
      - {cerca: "crag classic", parole: [crag]}            # Mammut 9.5 Crag Classic / Dry
      - {cerca: "mammut infinity", parole: [infinity]}     # Mammut Infinity 9.5
      - {cerca: "petzl arial", parole: [arial]}            # Petzl Arial 9.5
      - {cerca: "edelrid boa", parole: [boa]}              # Edelrid Boa 9.8
      - {cerca: "edelrid eagle", parole: [eagle]}          # Edelrid Eagle Lite 9.5
      - {cerca: "edelrid heron", parole: [heron]}          # Edelrid Heron 9.8
      - {cerca: "tendon ambition", parole: [ambition]}     # Tendon Ambition 9.8
      - {cerca: "edelweiss curve", parole: [curve]}        # Edelweiss Curve 9.8
      - {cerca: "edelweiss thunder", parole: [thunder]}    # Edelweiss Thunder 9.5
      - {cerca: "petzl volta", parole: [volta]}            # Petzl Volta 9.2
      # ricerche generiche: qualsiasi marca, filtrata per diametro e lunghezza
      - {<<: *corda_generica, cerca: "corda singola"}
      - {<<: *corda_generica, cerca: "corda intera"}
      - {<<: *corda_generica, cerca: "corda 9.5"}
      - {<<: *corda_generica, cerca: "corda 9.8"}
      - {<<: *corda_generica, cerca: "rope 9.5"}
      - {<<: *corda_generica, cerca: "corda dinamica"}

  # ------------------------------------------------------------- PICCOZZE
  # Piccozze classiche da alpinismo (non attrezzi da ghiaccio tecnici).
  # taglie: lunghezze accettate. [] = qualsiasi lunghezza.
  - id: piccozza
    nome: "Piccozza classica da alpinismo"
    taglie: ["50cm", "51cm", "52cm", "53cm", "54cm", "55cm", "50", "51", "52", "53", "54", "55"]
    prezzo_max: 130
    prezzo_top: 100
    prezzo_min: 50       # sotto: lacci, protezioni, accessori
    escludi: [nomic, ergo, quark, fusion, dragonne, leash, laccio, lacci, protezione, protezioni,
              protector, guard, cover, copri, becca, lama, pick, blade, puntale, spike, martello,
              hammer, adze, pala, paletta, shovel, griprest, trigger, holster, porta, holder,
              ramponi, rampone, crampon, crampons, kit, set]
    richiedi_una_di: *parole_piccozza
    modelli:
      - {cerca: "air tech", parole: [air, tech]}             # Grivel Air Tech Evo / Racing
      - {cerca: "ghost evo", parole: [grivel, ghost]}        # Grivel Ghost Evo
      - {cerca: "summit evo", parole: [petzl, summit]}       # Petzl Summit Evo / Summit
      - {cerca: "sum'tec", parole: [sum, tec]}               # Petzl Sum'Tec
      - {cerca: "raven", parole: [raven]}                    # Black Diamond Raven / Pro / Ultra
      - {cerca: "venom", parole: [venom]}                    # Black Diamond Venom
      - {cerca: "alpin tour", parole: [alpin, tour]}         # Climbing Technology Alpin Tour
      - {cerca: "corsa alpin", parole: [corsa]}              # CAMP Corsa Alpin / Nanotech
      # ricerche generiche: qualsiasi piccozza da alpinismo
      - &piccozza_generica
        cerca: "piccozza"
        parole: []
        parole_una_di: *parole_piccozza
        filtro_link: []
        filtro_link_una_di: *parole_piccozza
        max_link: 40
      - {<<: *piccozza_generica, cerca: "piccozza alpinismo"}
      - {<<: *piccozza_generica, cerca: "ice axe"}

  # ------------------------------------------------------------- RAMPONI
  # 12 punte, semiautomatici (puntale con fettuccia + leva al tallone):
  # compatibili con Trango Alpine e Aequilibrium ST (scarponi B2).
  - id: ramponi
    nome: "Ramponi 12 punte semiautomatici"
    taglie: []                       # i ramponi sono quasi sempre taglia unica
    prezzo_max: 120
    prezzo_top: 100
    prezzo_min: 60                   # sotto: antizoccolo, sacche, ricambi
    # scarta: a cinghie (classic/flexlock/strap), automatici (step-in), accessori
    escludi: [flexlock, fl, strap, straps, classic, cramp, step, universal, antibott, antiboot, antizoccolo,
              abp, anti, bag, sacca, custodia, pouch, case, protector, protezione, protezioni, spare,
              ricambio, ricambi, kit, link, barra, bar, front, puntale, puntali, 10, 10p, 8, 8p, 14,
              g10, g14, g20, g22, wide]
    richiedi_una_di: *parole_ramponi
    modelli:
      - {cerca: "vasak leverlock", parole: [vasak]}            # Petzl Vasak Leverlock
      - {cerca: "sarken leverlock", parole: [sarken]}          # Petzl Sarken Leverlock
      - {cerca: "g12 new-matic", parole: [g12]}                # Grivel G12 New-Matic (Evo)
      - {cerca: "air tech new-matic", parole: [air, tech, matic]}  # Grivel Air Tech New-Matic
      - {cerca: "stalker semi-automatic", parole: [stalker]}  # CAMP Stalker Semi-Auto
      - {cerca: "sabretooth clip", parole: [sabretooth]}       # Black Diamond Sabretooth Clip
      - {cerca: "serac clip", parole: [serac]}                 # Black Diamond Serac Clip
      - {cerca: "nuptse evo", parole: [nuptse]}                # Climbing Technology Nuptse Evo
      # ricerche generiche: qualsiasi rampone semiautomatico
      - &ramponi_generici
        cerca: "ramponi semiautomatici"
        parole: []
        parole_una_di: [*parole_ramponi, [semi, semiautomatico, semiautomatici, semiautomatic, semiauto,
                                          leverlock, matic, clip, hybrid, ibrido, ibridi]]
        filtro_link: []
        filtro_link_una_di: *parole_ramponi
        max_link: 40
      - {<<: *ramponi_generici, cerca: "ramponi alpinismo"}
      - {<<: *ramponi_generici, cerca: "crampons semi automatic"}

  # ------------------------------------------------------------- IMBRAGO

      - {cerca: "vaude larice", parole: [larice]}               # Vaude Larice
      - {cerca: "salewa agner", parole: [agner]}                # Salewa Agner DST / Durastretch
      - {cerca: "salewa pedroc", parole: [pedroc]}              # Salewa Pedroc
      - {cerca: "courmayeur so", parole: [courmayeur]}          # Mammut Courmayeur SO

    modelli:
      - {cerca: "petzl adjama", parole: [adjama]}              # Petzl Adjama
      - {cerca: "petzl corax", parole: [corax]}                # Petzl Corax (taglia 1 = XS-M)
      - {cerca: "momentum harness", parole: [momentum]}        # Black Diamond Momentum
      - {cerca: "edelrid jay", parole: [edelrid, jay]}         # Edelrid Jay

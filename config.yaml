        cerca: "imbrago alpinismo"
        parole: []
        parole_una_di: *parole_imbrago
        filtro_link: []
        filtro_link_una_di: *parole_imbrago
        max_link: 40
      - {<<: *imbrago_generico, cerca: "imbrago"}
      - {<<: *imbrago_generico, cerca: "climbing harness"}

  # ------------------------------------------------------------- MAGLIE MERINO
  - id: merino-corta
    nome: "Maglietta merino manica corta"
    taglie: [M]
    prezzo_max: 35
    prezzo_top: 28
    prezzo_min: 15

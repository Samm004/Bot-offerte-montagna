        filtro_link_una_di: [merino, wool, lana, icebreaker, smartwool, devold, ortovox, natural, mons,
                             royale, brynje, woolpower, aclima, rewoolution, bergans, artilect]
        max_link: 40
      - {<<: *merino_corta, cerca: "maglia merino manica corta"}
      - {<<: *merino_corta, cerca: "merino tee"}
      - {<<: *merino_corta, cerca: "icebreaker"}
      - {<<: *merino_corta, cerca: "smartwool"}
      - {<<: *merino_corta, cerca: "ortovox merino"}

  - id: merino-lunga
    nome: "Maglia merino manica lunga"
    taglie: [M]
    prezzo_max: 45
    prezzo_top: 38
    prezzo_min: 20
    escludi: [ss, short, corta, corte, kurzarm, mc, tee, tshirt, t]
    modelli:
      - &merino_lunga
        cerca: "maglia merino manica lunga"
        parole: []
        parole_una_di: [*parole_lana, *parole_maglia, *parole_manica_lunga]
        escludi: *escludi_maglie
        filtro_link: []
        filtro_link_una_di: [merino, wool, lana, icebreaker, smartwool, devold, ortovox, natural, mons,
                             royale, brynje, woolpower, aclima, rewoolution, bergans, artilect]
        max_link: 40
      - {<<: *merino_lunga, cerca: "merino long sleeve"}
      - {<<: *merino_lunga, cerca: "maglia lana merino"}
      - {<<: *merino_lunga, cerca: "icebreaker"}
      - {<<: *merino_lunga, cerca: "smartwool"}
      - {<<: *merino_lunga, cerca: "ortovox merino"}

  # ------------------------------------------------------------- PANTALONI SOFTSHELL
  # Tipo Vaude Larice: softshell elasticizzati da alpinismo / trekking.
  - id: pantaloni-softshell
    nome: "Pantaloni softshell"
    taglie: [M, "48"]
    prezzo_max: 90
    prezzo_top: 75
    prezzo_min: 50
    escludi: [shorts, bermuda, "3", tights, leggings, insulated, imbottiti, imbottito, primaloft, down,
              piumino, bib, salopette, jacket, giacca, vest, gilet, gaiter, ghette, overpant, overpants,
